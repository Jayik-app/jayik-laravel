<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Webhook flow: Jayik posts a signed request, the package verifies it and dispatches the WebhookReceived event">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#0A6E2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1278" height="298" rx="24" fill="#F7FAF6" stroke="#E4E9E2" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="56" font-size="13" font-weight="700" letter-spacing="2.2" fill="#0A6E2E">WEBHOOK FLOW</text>
    <text x="1224" y="56" text-anchor="end" font-size="13" fill="#6B7C73">answer within 5 seconds</text>

    <g stroke="#0A6E2E" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="280" y1="145" x2="352" y2="145"/>
      <line x1="610" y1="145" x2="682" y2="145"/>
      <line x1="940" y1="145" x2="1012" y2="145"/>
    </g>
    <line x1="811" y1="198" x2="811" y2="232" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrowRed)"/>
    <text x="811" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#C0392B">401 when the signature is wrong or too old</text>

    <!-- 1 -->
    <rect x="56" y="96" width="220" height="98" rx="18" fill="#0B1410"/>
    <circle cx="84" cy="124" r="5" fill="#35D85F"/>
    <text x="98" y="129" font-size="12" font-weight="700" letter-spacing="1.6" fill="#9DB0A5">JAYIK</text>
    <text x="80" y="158" font-size="16" font-weight="700" fill="#FFFFFF">Order changes</text>
    <text x="80" y="179" font-size="13" fill="#9DB0A5">created · updated · assigned</text>

    <!-- 2 -->
    <rect x="356" y="96" width="250" height="98" rx="18" fill="#FFFFFF" stroke="#BFDCC6" stroke-width="2"/>
    <text x="380" y="129" font-size="12" font-weight="700" letter-spacing="1.6" fill="#0A6E2E">SIGNED REQUEST</text>
    <text x="380" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0B1410">POST /jayik/webhook</text>
    <text x="380" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#52655C">X-Jayik-Signature</text>

    <!-- 3 -->
    <rect x="686" y="96" width="250" height="98" rx="18" fill="#E5F4E8" stroke="#BFDCC6" stroke-width="2"/>
    <text x="710" y="129" font-size="12" font-weight="700" letter-spacing="1.6" fill="#0A6E2E">THE PACKAGE</text>
    <text x="710" y="158" font-size="16" font-weight="700" fill="#0B1410">Verifies the signature</text>
    <text x="710" y="179" font-size="13" fill="#52655C">HMAC-SHA256 · 5 minute window</text>

    <!-- 4 -->
    <rect x="1016" y="96" width="208" height="98" rx="18" fill="#0A6E2E"/>
    <text x="1040" y="129" font-size="12" font-weight="700" letter-spacing="1.6" fill="#8BE9A4">YOUR APP</text>
    <text x="1040" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FFFFFF">WebhookReceived</text>
    <text x="1040" y="179" font-size="13" fill="#CFEBD6">your listener runs</text>
  </g>
</svg>
